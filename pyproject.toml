[project]
name = "sat-coach"
version = "0.1.0"
description = "Adaptive Digital SAT practice: generated questions, official-style explanations, projected scores."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "sympy>=1.12",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "google-genai>=1.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
sat-coach = "sat_coach.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sat_coach*"]

[tool.setuptools.package-data]
sat_coach = ["web/*", "web/vendor/*", "web/vendor/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
